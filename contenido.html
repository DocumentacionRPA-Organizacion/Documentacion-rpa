<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cargando contenido...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #13313a;
            --ink-soft: #5e767d;
            --surface: rgba(255, 255, 255, 0.9);
            --surface-strong: #ffffff;
            --line: rgba(19, 49, 58, 0.1);
            --accent: #0f8b8d;
            --accent-dark: #0b5f73;
            --accent-soft: #d9f2ef;
            --hero-start: #153c52;
            --hero-end: #0f8b8d;
            --shadow: 0 24px 60px rgba(10, 36, 45, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.42), transparent 28%),
                radial-gradient(circle at bottom right, rgba(15, 139, 141, 0.16), transparent 32%),
                linear-gradient(180deg, #9eb5b8 0%, #c7d8da 100%);
        }

        .page-shell {
            width: min(1040px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 56px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: clamp(28px, 5vw, 48px);
            border-radius: 30px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--hero-start), var(--hero-end));
            box-shadow: var(--shadow);
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: auto -80px -110px auto;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.14);
        }

        .hero h1 {
            margin: 18px 0 10px;
            font-size: clamp(1.9rem, 4vw, 3rem);
            line-height: 1.08;
        }

        .hero p {
            margin: 0;
            max-width: 720px;
            color: rgba(255, 255, 255, 0.86);
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0 14px;
        }

        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid rgba(15, 139, 141, 0.18);
            background: rgba(255, 255, 255, 0.82);
            color: var(--ink);
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 28px rgba(11, 39, 47, 0.08);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .action-link:hover {
            transform: translateY(-2px);
            border-color: rgba(15, 139, 141, 0.4);
            box-shadow: 0 14px 30px rgba(11, 39, 47, 0.12);
        }

        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 18px;
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        .breadcrumb a,
        .breadcrumb-current {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(19, 49, 58, 0.06);
        }

        .breadcrumb a:hover {
            color: var(--accent-dark);
        }

        .breadcrumb-separator {
            color: rgba(19, 49, 58, 0.45);
            font-weight: 700;
        }

        .content-panel {
            padding: 24px;
            border-radius: 28px;
            background: var(--surface);
            box-shadow: 0 18px 44px rgba(11, 39, 47, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
        }

        .panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            justify-content: space-between;
            gap: 10px 16px;
            margin-bottom: 20px;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.35rem;
        }

        .panel-header p {
            margin: 0;
            color: var(--ink-soft);
        }

        .content-list {
            display: grid;
            gap: 14px;
        }

        .content-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border-radius: 20px;
            background: var(--surface-strong);
            border: 1px solid var(--line);
            color: var(--ink);
            text-decoration: none;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .content-item:hover {
            transform: translateY(-2px);
            border-color: rgba(15, 139, 141, 0.32);
            box-shadow: 0 14px 30px rgba(11, 39, 47, 0.08);
        }

        .content-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--accent-soft);
            color: var(--accent-dark);
            font-size: 1.2rem;
        }

        .content-meta {
            min-width: 0;
        }

        .content-name {
            display: block;
            font-weight: 800;
            line-height: 1.4;
            word-break: break-word;
        }

        .content-type {
            display: block;
            margin-top: 4px;
            color: var(--ink-soft);
            font-size: 0.92rem;
        }

        .content-arrow {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .status-message,
        .error-message {
            padding: 18px;
            border-radius: 18px;
            line-height: 1.6;
        }

        .status-message {
            background: rgba(255, 255, 255, 0.76);
            color: var(--ink-soft);
        }

        .error-message {
            background: rgba(176, 31, 31, 0.08);
            color: #8f1f1f;
            border: 1px solid rgba(176, 31, 31, 0.14);
        }

        @media (max-width: 640px) {
            .page-shell {
                width: min(100% - 20px, 1040px);
                padding-top: 14px;
            }

            .content-panel {
                padding: 18px;
            }

            .content-item {
                grid-template-columns: auto 1fr;
            }

            .content-arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <span class="hero-label">Explorador de carpetas</span>
            <h1 id="titulo-carpeta">Cargando contenido...</h1>
            <p>Navega entre carpetas y archivos del repositorio con una ruta más clara y un acceso rápido para volver.</p>
        </section>

        <div class="actions">
            <a id="back-button" class="action-link" href="./">← Volver</a>
            <a id="home-button" class="action-link" href="./">⌂ Inicio</a>
        </div>

        <nav class="breadcrumb" id="breadcrumb-links" aria-label="Ruta de navegación"></nav>

        <section class="content-panel">
            <div class="panel-header">
                <h2>Contenido disponible</h2>
                <p id="panel-subtitle">Cargando datos del repositorio...</p>
            </div>
            <div id="lista-contenido" class="content-list" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const GITHUB_USERNAME = "DocumentacionRPA-Organizacion";
        const REPOSITORY_SLUG = "Documentacion-rpa";
        const BRANCH_NAME = "main";

        // Misma URL que la portada publicada ("./"), para no abrir una copia
        // antigua de index.html guardada en caché. Al abrir el archivo en local
        // (file://) "./" mostraría la carpeta, así que ahí se usa index.html.
        const HOME_URL = window.location.protocol === "file:" ? "index.html" : "./";

        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY_SLUG}/contents`;

        const FOLDER_LABELS = {
            "0_documentacion_proyecto": "Documentación del proyecto",
            "1_estandares_y_metadatos": "Estándares y metadatos",
            "2_recursos_estudiantes": "Recursos de estudiantes",
            "2.1_Basico": "Básico",
            "2.2_Intermedio": "Intermedio",
            "2.3_Avanzado": "Avanzado",
            "3_recursos_docentes": "Recursos de docentes",
            "4_herramienta_rpa": "Herramienta RPA",
            "4.2_automation_anywhere": "Automation Anywhere",
            "5_procesos_academicos_simulados": "Procesos académicos simulados",
            "6_evaluacion_y_retroalimentacion": "Evaluación y retroalimentación",
            "7_informes_y_documentacion": "Informes y documentación",
            "8_Diplomas": "Diplomas",
            "8.1_DiplomaGeneral": "Diploma general",
            "8.2_DiplomasIndividuales": "Diplomas individuales"
        };

        // Palabras con escritura fija sin importar cómo se nombre la carpeta.
        const WORD_LABELS = {
            "uipath": "UiPath",
            "rpa": "RPA"
        };

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function splitPath(path) {
            return String(path || "")
                .split("/")
                .map(part => part.trim())
                .filter(part => part && part !== "." && part !== "..");
        }

        function folderHref(path) {
            return `contenido.html?folder=${encodeURIComponent(path)}`;
        }

        function prettifySegment(segment) {
            if (FOLDER_LABELS[segment]) {
                return FOLDER_LABELS[segment];
            }

            const words = segment
                .replace(/^[\d.]+[_-]?/, "")   // quita el prefijo numérico (2_, 2.1_, 4.2_)
                .split(/[_\-\s]+/)
                .filter(Boolean)
                .flatMap(word => {
                    const fixed = WORD_LABELS[word.toLowerCase()];

                    // "UiPath" se respeta; "DiplomaGeneral" se separa en dos palabras
                    return fixed ? [fixed] : word.replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, "$1 $2").split(" ");
                });

            if (!words.length) {
                return segment;
            }

            return words
                .map((word, index) => {
                    const fixed = WORD_LABELS[word.toLowerCase()];

                    if (fixed) {
                        return fixed;
                    }

                    if (index === 0) {
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    }

                    return word.toLowerCase();
                })
                .join(" ");
        }

        function updateBackButton(parts) {
            const backButton = document.getElementById("back-button");

            if (parts.length <= 1) {
                backButton.href = HOME_URL;
                backButton.textContent = "← Volver al inicio";
                return;
            }

            const parentParts = parts.slice(0, -1);
            backButton.href = folderHref(parentParts.join("/"));
            backButton.textContent = `← Volver a ${prettifySegment(parentParts[parentParts.length - 1])}`;
        }

        function renderBreadcrumb(parts) {
            const breadcrumb = document.getElementById("breadcrumb-links");
            let html = `<a href="${escapeHtml(HOME_URL)}">Inicio</a>`;

            parts.forEach((part, index) => {
                const label = escapeHtml(prettifySegment(part));
                html += '<span class="breadcrumb-separator" aria-hidden="true">›</span>';

                if (index < parts.length - 1) {
                    html += `<a href="${escapeHtml(folderHref(parts.slice(0, index + 1).join("/")))}">${label}</a>`;
                } else {
                    html += `<span class="breadcrumb-current" aria-current="page">${label}</span>`;
                }
            });

            breadcrumb.innerHTML = html;
        }

        function showMessage(subtitleText, messageText, isError) {
            document.getElementById("panel-subtitle").textContent = subtitleText;

            const list = document.getElementById("lista-contenido");
            const box = document.createElement("div");
            box.className = isError ? "error-message" : "status-message";
            box.textContent = messageText;
            list.replaceChildren(box);
        }

        function renderItems(items, folderPath) {
            const visibleItems = items.filter(item => item && item.name && !item.name.startsWith("."));

            if (!visibleItems.length) {
                showMessage("No hay elementos en esta carpeta.", "Esta carpeta está vacía por ahora.", false);
                return;
            }

            const total = visibleItems.length;
            document.getElementById("panel-subtitle").textContent =
                `${total} elemento${total === 1 ? "" : "s"} encontrado${total === 1 ? "" : "s"}.`;

            const sortedItems = [...visibleItems].sort((a, b) => {
                const aIsDir = a.type === "dir";
                const bIsDir = b.type === "dir";

                if (aIsDir !== bIsDir) {
                    return aIsDir ? -1 : 1;
                }

                return a.name.localeCompare(b.name, "es", { numeric: true, sensitivity: "base" });
            });

            document.getElementById("lista-contenido").innerHTML = sortedItems.map(item => {
                const isDirectory = item.type === "dir";
                const href = isDirectory
                    ? folderHref(`${folderPath}/${item.name}`)
                    : (item.download_url || item.html_url || "#");
                const target = isDirectory ? "" : ' target="_blank" rel="noopener noreferrer"';
                const icon = isDirectory ? "📁" : "📄";
                const typeLabel = isDirectory ? "Carpeta" : "Archivo";
                const arrow = isDirectory ? "→" : "↗";

                return `
                    <a class="content-item" href="${escapeHtml(href)}"${target}>
                        <span class="content-icon" aria-hidden="true">${icon}</span>
                        <span class="content-meta">
                            <span class="content-name">${escapeHtml(item.name)}</span>
                            <span class="content-type">${typeLabel}</span>
                        </span>
                        <span class="content-arrow" aria-hidden="true">${arrow}</span>
                    </a>
                `;
            }).join("");
        }

        async function cargarContenidoDinamico() {
            const params = new URLSearchParams(window.location.search);
            const parts = splitPath(params.get("folder"));

            if (!parts.length) {
                window.location.replace(HOME_URL);
                return;
            }

            document.getElementById("home-button").href = HOME_URL;

            const folderPath = parts.join("/");
            const displayTitle = prettifySegment(parts[parts.length - 1]);

            document.getElementById("titulo-carpeta").textContent = displayTitle;
            document.title = `${displayTitle} | Proyecto RPA`;

            updateBackButton(parts);
            renderBreadcrumb(parts);
            showMessage("Cargando datos del repositorio...", "Cargando contenido del repositorio...", false);

            const apiPath = parts.map(encodeURIComponent).join("/");

            try {
                const response = await fetch(`${GITHUB_API_URL}/${apiPath}?ref=${encodeURIComponent(BRANCH_NAME)}`, {
                    headers: {
                        Accept: "application/vnd.github+json"
                    }
                });

                if (response.status === 403 || response.status === 429) {
                    throw new Error("GitHub limitó temporalmente las consultas desde tu red (60 por hora sin iniciar sesión). Espera unos minutos y vuelve a cargar la página.");
                }

                if (response.status === 404) {
                    throw new Error(`La carpeta "${folderPath}" no existe en el repositorio. Puede que se haya renombrado; vuelve al inicio.`);
                }

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: no se pudo abrir la ruta "${folderPath}".`);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error(`"${folderPath}" no es una carpeta.`);
                }

                renderItems(data, folderPath);
            } catch (error) {
                console.error("Error al cargar datos de GitHub:", error);

                const message = error instanceof TypeError
                    ? "No se pudo conectar con GitHub. Revisa tu conexión a internet y vuelve a cargar la página."
                    : error.message;

                showMessage("No fue posible cargar esta carpeta.", message, true);
            }
        }

        cargarContenidoDinamico();
    </script>
</body>
</html>
